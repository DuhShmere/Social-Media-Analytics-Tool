{% extends "base.html" %} {% block title %} Edit Post | Social Media Analytics
Tool {% endblock %} {% block content %}
<section class="form-page">
  <div class="page-heading">
    <div>
      <h1>Edit Post</h1>

      <p>Update the content details and engagement metrics.</p>
    </div>
  </div>

  {% if error %}
  <div class="message error-message" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST" class="data-form" data-loading-text="Saving…">
    {% include "partials/post_form_fields.html" %}

    <div class="form-actions">
      <a class="button button-secondary" href="{{ url_for('main.dashboard') }}">
        Cancel
      </a>

      <button class="button" type="submit">Save Changes</button>
    </div>
  </form>
</section>
{% endblock %}
