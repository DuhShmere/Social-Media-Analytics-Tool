{% extends "base.html" %}

{% block title %}
  Edit Post | Social Media Analytics Tool
{% endblock %}

{% block content %}
  <section class="form-page">
    <div class="page-heading">
      <div>
        <h1>Edit Post</h1>

        <p>
          Update the content details and engagement metrics.
        </p>
      </div>
    </div>

    {% if error %}
      <div class="message error-message">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" class="data-form">
      <div class="form-group">
        <label for="platform">Platform</label>

        <select
          id="platform"
          name="platform"
          required
        >
          {% set platforms = [
            "Instagram",
            "TikTok",
            "YouTube",
            "LinkedIn",
            "X"
          ] %}

          {% for platform in platforms %}
            <option
              value="{{ platform }}"
              {% if post.platform == platform %}
                selected
              {% endif %}
            >
              {{ platform }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="caption">
          Caption or title
        </label>

        <input
          id="caption"
          name="caption"
          type="text"
          maxlength="300"
          value="{{ post.caption }}"
          required
        >
      </div>

      <div class="form-group">
        <label for="content_type">
          Content type
        </label>

        <select
          id="content_type"
          name="content_type"
          required
        >
          {% set content_types = [
            "Video",
            "Short",
            "Image",
            "Carousel",
            "Text"
          ] %}

          {% for content_type in content_types %}
            <option
              value="{{ content_type }}"
              {% if post.content_type == content_type %}
                selected
              {% endif %}
            >
              {{ content_type }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="posted_at">
          Date and time posted
        </label>

        <input
          id="posted_at"
          name="posted_at"
          type="datetime-local"
          value="{{ post.posted_at.strftime(
            '%Y-%m-%dT%H:%M'
          ) }}"
          required
        >
      </div>

      <div class="metrics-grid">
        <div class="form-group">
          <label for="views">Views</label>

          <input
            id="views"
            name="views"
            type="number"
            min="0"
            value="{{ post.views }}"
          >
        </div>

        <div class="form-group">
          <label for="likes">Likes</label>

          <input
            id="likes"
            name="likes"
            type="number"
            min="0"
            value="{{ post.likes }}"
          >
        </div>

        <div class="form-group">
          <label for="comments">Comments</label>

          <input
            id="comments"
            name="comments"
            type="number"
            min="0"
            value="{{ post.comments }}"
          >
        </div>

        <div class="form-group">
          <label for="shares">Shares</label>

          <input
            id="shares"
            name="shares"
            type="number"
            min="0"
            value="{{ post.shares }}"
          >
        </div>

        <div class="form-group">
          <label for="saves">Saves</label>

          <input
            id="saves"
            name="saves"
            type="number"
            min="0"
            value="{{ post.saves }}"
          >
        </div>
      </div>

      <div class="form-actions">
        <a
          class="button button-secondary"
          href="{{ url_for('dashboard') }}"
        >
          Cancel
        </a>

        <button class="button" type="submit">
          Save Changes
        </button>
      </div>
    </form>
  </section>
{% endblock %}
