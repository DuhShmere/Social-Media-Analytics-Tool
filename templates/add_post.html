{% extends "base.html" %} {% block title %} Add Post | Social Media Analytics
Tool {% endblock %} {% block content %}
<section class="form-page">
  <div class="page-heading">
    <div>
      <h1>Add a Post</h1>

      <p>Manually record content and engagement metrics.</p>
    </div>
  </div>

  {% if error %}
  <div class="message error-message">{{ error }}</div>
  {% endif %}

  <form method="POST" class="data-form">
    <div class="form-group">
      <label for="platform">Platform</label>

      <select id="platform" name="platform" required>
        <option value="">Choose a platform</option>
        <option value="Instagram">Instagram</option>
        <option value="TikTok">TikTok</option>
        <option value="YouTube">YouTube</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="X">X</option>
      </select>
    </div>

    <div class="form-group">
      <label for="caption">Caption or title</label>

      <input
        id="caption"
        name="caption"
        type="text"
        maxlength="300"
        placeholder="Enter the post caption or title"
        required
      />
    </div>

    <div class="form-group">
      <label for="content_type">Content type</label>

      <select id="content_type" name="content_type" required>
        <option value="">Choose a content type</option>
        <option value="Video">Video</option>
        <option value="Short">Short</option>
        <option value="Image">Image</option>
        <option value="Carousel">Carousel</option>
        <option value="Text">Text</option>
      </select>
    </div>

    <div class="form-group">
      <label for="posted_at"> Date and time posted </label>

      <input id="posted_at" name="posted_at" type="datetime-local" required />
    </div>

    <div class="metrics-grid">
      <div class="form-group">
        <label for="views">Views</label>

        <input id="views" name="views" type="number" min="0" value="0" />
      </div>

      <div class="form-group">
        <label for="likes">Likes</label>

        <input id="likes" name="likes" type="number" min="0" value="0" />
      </div>

      <div class="form-group">
        <label for="comments">Comments</label>

        <input id="comments" name="comments" type="number" min="0" value="0" />
      </div>

      <div class="form-group">
        <label for="shares">Shares</label>

        <input id="shares" name="shares" type="number" min="0" value="0" />
      </div>

      <div class="form-group">
        <label for="saves">Saves</label>

        <input id="saves" name="saves" type="number" min="0" value="0" />
      </div>
    </div>

    <div class="form-actions">
      <a class="button button-secondary" href="{{ url_for('dashboard') }}">
        Cancel
      </a>

      <button class="button" type="submit">Save Post</button>
    </div>
  </form>
</section>
{% endblock %}
